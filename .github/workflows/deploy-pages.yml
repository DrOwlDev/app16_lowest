name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Snapshot includes lowest + highest Gamma tags and preloaded temp series
      # so the web app matches Windows/Android market logic without CORS calls.
      - name: Export markets + temperature snapshot
        run: dart run tool/export_markets.dart web/data/markets.json

      - name: Build web
        run: flutter build web --release --base-href /app16_lowest/

      - name: Ensure data in build output
        run: |
          mkdir -p build/web/data
          cp web/data/markets.json build/web/data/markets.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
